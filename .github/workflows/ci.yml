name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install "ruff>=0.9.0"

      - run: ruff check .

      - run: ruff format . --check

      # wxPython publishes no Linux wheels on PyPI; the only source is the
      # extras.wxpython.org server, which is occasionally slow/unreachable.
      # Cache the wheel so CI contacts that host only on a cache miss, and
      # never let pip fall back to a (multi-hour) source build.
      - name: Restore cached wxPython wheel (Linux)
        id: wx-cache
        uses: actions/cache/restore@v4
        with:
          path: wx-wheels
          key: wxpython-wheel-${{ runner.os }}-py3.11-v1
      - name: Download wxPython wheel (Linux)
        if: steps.wx-cache.outputs.cache-hit != 'true'
        run: >-
          pip download --only-binary=:all: --no-deps --timeout 60 --retries 5
          -d wx-wheels
          -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04 wxPython
      - name: Install wxPython (Linux)
        run: pip install --no-index --no-deps --find-links wx-wheels wxPython
      # Save only after a successful download + install, so a failed
      # download (e.g. the host being down) can never poison the cache.
      - name: Save wxPython wheel to cache (Linux)
        if: steps.wx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wx-wheels
          key: wxpython-wheel-${{ runner.os }}-py3.11-v1

      - run: pip install -e ".[dev]"

      - run: mypy src/pineuro/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install build

      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Restore cached wxPython wheel (Linux)
        id: wx-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: wx-wheels
          key: wxpython-wheel-${{ runner.os }}-py${{ matrix.python-version }}-v1
      - name: Download wxPython wheel (Linux)
        if: runner.os == 'Linux' && steps.wx-cache.outputs.cache-hit != 'true'
        run: >-
          pip download --only-binary=:all: --no-deps --timeout 60 --retries 5
          -d wx-wheels
          -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04 wxPython
      - name: Install wxPython (Linux)
        if: runner.os == 'Linux'
        run: pip install --no-index --no-deps --find-links wx-wheels wxPython
      # Save only after a successful download + install, so a failed
      # download (e.g. the host being down) can never poison the cache.
      - name: Save wxPython wheel to cache (Linux)
        if: runner.os == 'Linux' && steps.wx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wx-wheels
          key: wxpython-wheel-${{ runner.os }}-py${{ matrix.python-version }}-v1

      - name: Pre-install build deps to avoid setuptools upgrade during editable install
        if: runner.os == 'Windows'
        run: pip install setuptools wheel

      - run: pip install -e ".[dev]"

      - run: pytest

  validation:
    # Scientific-correctness gate: runs synthetic data through the real
    # pipeline (ANTsPy, nilearn) and asserts pineuro recovers known ground
    # truth. Slow by design; single OS since the science libraries are
    # platform-independent.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Single-threaded ITK/BLAS so the iterative optimizers (ANTs, CanICA) are
      # reproducible -- the exact / first-principles checks in tests/validation/
      # rely on it. conftest.py sets these too; this makes the pinning explicit in CI.
      ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore cached wxPython wheel (Linux)
        id: wx-cache
        uses: actions/cache/restore@v4
        with:
          path: wx-wheels
          key: wxpython-wheel-${{ runner.os }}-py3.11-v1
      - name: Download wxPython wheel (Linux)
        if: steps.wx-cache.outputs.cache-hit != 'true'
        run: >-
          pip download --only-binary=:all: --no-deps --timeout 60 --retries 5
          -d wx-wheels
          -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04 wxPython
      - name: Install wxPython (Linux)
        run: pip install --no-index --no-deps --find-links wx-wheels wxPython
      # Save only after a successful download + install, so a failed
      # download (e.g. the host being down) can never poison the cache.
      - name: Save wxPython wheel to cache (Linux)
        if: steps.wx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wx-wheels
          key: wxpython-wheel-${{ runner.os }}-py3.11-v1

      - run: pip install -e ".[dev]"

      - name: Run validation suite
        run: pytest -m validation -v --durations=20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: tests/validation/_report/
