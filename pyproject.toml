[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pineuro"
version = "1.1.0"
description = "Python for Individualized Neurofeedback"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{name = "Marlee M Vandewouw", email = "marlee.vandewouw@outlook.com"}]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    # antspyx/nilearn are exact-pinned: the validation suite asserts their
    # output via exact / first-principles checks that only reproduce when the
    # iterative optimizers run deterministically (single-threaded ITK/BLAS; see
    # tests/validation/conftest.py). A version bump can change that output, so it
    # must be a deliberate, re-verified change -- see tests/validation/README.md.
    "antspyx==0.6.2",
    "dcm2niix",
    # Linux-only: reads /dev/input/event* for global key polling under Wayland,
    # where XQueryKeymap is starved of events when the stimulus window is
    # unfocused (see tasks/task_base.py:_poll_keys_evdev). Compiles against
    # linux/input.h, so it must not install on Windows/macOS.
    "evdev; sys_platform == 'linux'",
    "flet==0.80.5",
    "flet-charts>=0.1.0",
    "matplotlib",
    "nibabel>=5.3.0",
    "nilearn==0.13.1",  # exact-pinned -- see the antspyx note above
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "psutil>=5.9",  # Terminate the ICA subprocess tree on GUI Stop (mask_extraction)
    "psychopy>=2025.2.0",
    "pygame>=2.6.0",  # Cross-platform audio backend for PsychoPy
    "pydicom",
    # Linux-only: Xlib window positioning (_move_window_xlib) and the Xorg
    # unfocused-key poll path (XQueryKeymap). Present transitively via PsychoPy
    # today, but pineuro uses it directly, so depend on it explicitly.
    "python-xlib; sys_platform == 'linux'",
    "pyyaml",
    "scipy>=1.14.0",
    "screeninfo>=0.8",
    "templateflow",
    "watchdog",
]

[project.urls]
Homepage = "https://github.com/WhitfieldGabrieli-EPICBrainLab/pineuro"
Documentation = "https://github.com/WhitfieldGabrieli-EPICBrainLab/pineuro/tree/main/docs"
Issues = "https://github.com/WhitfieldGabrieli-EPICBrainLab/pineuro/issues"
Changelog = "https://github.com/WhitfieldGabrieli-EPICBrainLab/pineuro/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# ruff and mypy are exact-pinned so the checks CI runs match a local
# `pip install -e ".[dev]"`: a new release can change their output on unchanged
# code (ruff 0.17 formats code blocks in Markdown files; 0.15 did not). Upgrade them
# deliberately, together with the ruff install in .github/workflows/ci.yml.
dev = ["build", "mypy==1.19.1", "pytest>=8.0", "ruff==0.15.2", "types-PyYAML"]

[project.scripts]
pineuro-gui = "pineuro.gui.app:main"

# Third-party task plugins register under this entry-point group.
# In a plugin package's pyproject.toml:
#   [project.entry-points."pineuro.tasks"]
#   my_task = "my_package.tasks"
# pineuro auto-discovers all registered plugins at GUI startup.
[project.entry-points."pineuro.tasks"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".venv", "__pycache__", "*.egg-info", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — formatter handles this
    "E402",   # module-level import not at top — lazy PsychoPy imports are intentional
    "UP007",  # Use X | Y for Union — noisy to enforce retroactively
    "B007",   # loop variable not used — common in NumPy loops (for _ in range(n))
    "B008",   # function call in default arg — legitimate for np.array() defaults
    "SIM108", # use ternary — hurts readability in numerical code
]
fixable = ["I", "UP", "E", "W", "F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["T20", "S101", "INP001", "E402"]
"tests/**/*.py" = ["T20", "S101", "INP001", "E402"]
"analysis/*.py" = ["T20", "S101", "INP001", "E402"]
"src/pineuro/gui/**/*.py" = ["B006"]
"src/pineuro/tasks/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pineuro"]
force-sort-within-sections = false
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (>10s)",
    "validation: scientific-correctness validation (real ANTs/nilearn/dcm2niix, synthetic ground truth)",
]
addopts = "-m 'not validation'"

# ---------------------------------------------------------------------------
# mypy — basic type checking
# ---------------------------------------------------------------------------

[tool.mypy]
# Keep in step with the Python of the lint-and-typecheck job in .github/workflows/ci.yml.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = ["import-untyped"]

# pineuro never imports PyQt6; mypy reaches it only through Pillow's ImageQt, and PsychoPy
# installs whatever PyQt6 is newest. PyQt6 6.12.0's stubs do not parse (`*args, /` in
# QtGui.pyi), which stopped mypy before it checked any of pineuro.
[[tool.mypy.overrides]]
module = ["PyQt6", "PyQt6.*"]
follow_imports = "skip"
follow_imports_for_stubs = true  # PyQt6 ships .pyi stubs, which mypy otherwise always follows

