[build-system]
   requires = ["setuptools>=45", "wheel"]
   build-backend = "setuptools.build_meta"

   [project]
   name = "pyrtnf"
   version = "0.1.0"
   description = "Python Real-Time fMRI Neurofeedback"
   authors = [{name = "Marlee M Vandewouw", email = "marlee.vandewouw@outlook.com"}]
   dependencies = [
      "numpy",
      "nibabel",
      "nilearn",
      "scipy",
      "pandas",
      "matplotlib",
      "pydicom",
      "templateflow",
      "psychopy",
      "watchdog",
      "pyyaml",
   ]

   [project.optional-dependencies]
   dev = []
   gui = ["flet>=0.23.0"]

   [project.scripts]
   pyrtnf-gui = "pyrtnf.gui.app:main"
