[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-neuro"
version = "0.1.0"
description = "Python for Individualized Neurofeedback"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Marlee M Vandewouw", email = "marlee.vandewouw@outlook.com"}]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "antspyx>=0.6.1",
    "dcm2niix",
    "flet>=0.23.0",
    "flet-charts>=0.1.0",
    "matplotlib",
    "nibabel>=5.3.0",
    "nilearn>=0.12.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "psychopy>=2025.2.0",
    "pygame>=2.6.0",  # Cross-platform audio backend for WSL compatibility
    "pydicom",
    "pyyaml",
    "scipy>=1.14.0",
    "screeninfo>=0.8",
    "templateflow",
    "watchdog",
]

[project.optional-dependencies]
dev = []

[project.scripts]
pineuro-gui = "pineuro.gui.app:main"
