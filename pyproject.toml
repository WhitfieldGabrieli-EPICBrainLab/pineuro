[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pineuro"
version = "0.1.0"
description = "Python for Individualized Neurofeedback"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{name = "Marlee M Vandewouw", email = "marlee.vandewouw@outlook.com"}]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "antspyx>=0.6.1",
    "dcm2niix",
    "flet==0.80.5",
    "flet-charts>=0.1.0",
    "matplotlib",
    "nibabel>=5.3.0",
    "nilearn>=0.12.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "psychopy>=2025.2.0",
    "pygame>=2.6.0",  # Cross-platform audio backend for PsychoPy
    "pydicom",
    "pyyaml",
    "scipy>=1.14.0",
    "screeninfo>=0.8",
    "templateflow",
    "watchdog",
]

[project.urls]
Homepage = "https://github.com/marlvan/pineuro"
Documentation = "https://github.com/marlvan/pineuro/tree/main/docs"
Issues = "https://github.com/marlvan/pineuro/issues"
Changelog = "https://github.com/marlvan/pineuro/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build", "mypy>=1.10", "pytest>=8.0", "ruff>=0.9.0", "types-PyYAML"]

[project.scripts]
pineuro-gui = "pineuro.gui.app:main"

# Third-party task plugins register under this entry-point group.
# In a plugin package's pyproject.toml:
#   [project.entry-points."pineuro.tasks"]
#   my_task = "my_package.tasks"
# pineuro auto-discovers all registered plugins at GUI startup.
[project.entry-points."pineuro.tasks"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".venv", "__pycache__", "*.egg-info", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — formatter handles this
    "E402",   # module-level import not at top — lazy PsychoPy imports are intentional
    "UP007",  # Use X | Y for Union — noisy to enforce retroactively
    "B007",   # loop variable not used — common in NumPy loops (for _ in range(n))
    "B008",   # function call in default arg — legitimate for np.array() defaults
    "SIM108", # use ternary — hurts readability in numerical code
]
fixable = ["I", "UP", "E", "W", "F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["T20", "S101", "INP001", "E402"]
"tests/**/*.py" = ["T20", "S101", "INP001", "E402"]
"analysis/*.py" = ["T20", "S101", "INP001", "E402"]
"src/pineuro/gui/**/*.py" = ["B006"]
"src/pineuro/tasks/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pineuro"]
force-sort-within-sections = false
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (>10s)",
    "integration: requires Rockland_NFB test data",
]
addopts = "-m 'not integration'"

# ---------------------------------------------------------------------------
# mypy — basic type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = ["import-untyped"]

