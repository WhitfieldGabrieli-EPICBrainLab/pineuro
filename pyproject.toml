[build-system]
   requires = ["setuptools>=45", "wheel"]
   build-backend = "setuptools.build_meta"

   [project]
   name = "pi-neuro"
   version = "0.1.0"
   description = "Python for Individualized Neurofeedback"
   authors = [{name = "Marlee M Vandewouw", email = "marlee.vandewouw@outlook.com"}]
   dependencies = [
      "antspyx",
      "flet>=0.23.0",
      "flet-charts>=0.1.0",
      "matplotlib",
      "nibabel",
      "nilearn",
      "numpy",
      "pandas",
      "psychopy",
      "pydicom",
      "pyyaml",
      "scipy",
      "screeninfo>=0.8",
      "templateflow",
      "watchdog",
   ]

   [project.optional-dependencies]
   dev = []

   [project.scripts]
   pineuro-gui = "pineuro.gui.app:main"
